<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SGR NetGuard - Agent</title>
  <style>
    :root { color-scheme: light dark; font-family: Segoe UI, Arial, sans-serif; }
    body { margin: 0; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; padding: 16px; }
    .card { width: min(100%, 420px); background: #111827; border: 1px solid #334155; border-radius: 16px; box-shadow: 0 20px 40px rgba(15,23,42,.45); overflow: hidden; }
    .header { padding: 16px 18px 10px; border-bottom: 1px solid #1f2937; }
    .title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .body { padding: 16px 18px 18px; }
    .status-ok { color: #86efac; }
    .status-warn { color: #fbbf24; }
    .status-bad { color: #f87171; }
    .mini { display: grid; gap: 10px; }
    .line { padding: 12px; background: #1f2937; border-radius: 12px; line-height: 1.5; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button { border: 0; border-radius: 999px; padding: 8px 12px; font-weight: 700; cursor: pointer; background: #2563eb; color: white; }
    button.secondary { background: #334155; }
    button.small { padding: 7px 10px; font-size: 12px; }
    .section { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: #172033; border: 1px solid #263449; }
    .section h4 { margin: 0 0 6px; font-size: 14px; }
    .section p { margin: 0; color: #cbd5e1; font-size: 13px; line-height: 1.55; }
    .muted { color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title">🛡 SGR NetGuard</div>
      <div class="muted" id="subtitle">Đang tải trạng thái...</div>
    </div>
    <div class="body" id="body"></div>
  </div>
  <script src="agent.js"></script>
</body>
</html>
