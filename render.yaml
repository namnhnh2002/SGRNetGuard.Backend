services:
  - type: web
    name: sgr-netguard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DashboardAuth__Enabled
        value: "true"
      - key: DashboardAuth__Username
        value: admin
      - key: DashboardAuth__Password
        generateValue: true
      - key: ConnectionStrings__SGRNetGuard
        sync: false