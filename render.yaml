services:
  - type: web
    name: sgr-netguard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DashboardAuth__Enabled
        value: "true"
      - key: DashboardAuth__Username
        value: admin
      - key: DashboardAuth__Password
        value: Sun@2026
      - key: ConnectionStrings__SGRNetGuard
        sync: false
      # Set this to Render PostgreSQL's DATABASE_URL, or use the equivalent
      # ConnectionStrings__SGRNetGuard environment variable.